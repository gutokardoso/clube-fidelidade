<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recompensas • Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">FIDELIZAÊ!</div><h2 id="title">Recompensas</h2><span class="muted">Escolha como usar seus pontos</span></div><div class="actions"><a id="backCard" class="btn secondary">Voltar ao cartão</a></div></header><main class="content"><section class="card"><div class="section-head"><div><h3>Catálogo de recompensas</h3><p class="small muted">As recompensas disponíveis são definidas pela empresa.</p></div><div class="points-balance compact"><span>Seu saldo</span><strong id="balance">0 pontos</strong></div></div><div id="rewards" class="reward-grid"><p class="muted">Carregando...</p></div></section></main><script src="/static/app.js"></script><script>const {api,$}=Clube;const id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));$('#backCard').href='/card?id='+encodeURIComponent(id);(async()=>{try{const j=await api('/api/card/rewards?id='+encodeURIComponent(id));$('#title').textContent=j.campaign_name||'Recompensas';$('#balance').textContent=Number(j.points_balance||0)+' pontos';$('#rewards').innerHTML=(j.rewards||[]).length?j.rewards.map(r=>{const ok=j.points_balance>=r.points_cost;return `<article class="reward-card">${r.image_data?`<img src="${r.image_data}" alt="${esc(r.name)}">`:'<div class="reward-image-placeholder">🎁</div>'}<div><h4>${esc(r.name)}</h4><p class="small muted">${esc(r.description||'')}</p><b>${r.points_cost} pontos</b><span class="viz-badge">${ok?'Disponível para resgate':'Faltam '+(r.points_cost-j.points_balance)+' pontos'}</span></div></article>`}).join(''):'<p class="muted">Nenhuma recompensa disponível no momento.</p>'}catch(e){$('#rewards').innerHTML='<div class="notice error">Não foi possível carregar as recompensas.</div>'}})();</script><div class="build-marker">{{VERSION}}</div></body></html>
