<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerência • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">CLUBE FIDELIDADE</div><h2>Painel do gerente</h2><span id="who" class="muted"></span></div><div class="actions"><a class="btn secondary" href="/attendant">Abrir atendimento</a><button class="btn secondary" onclick="Clube.logout()">Sair</button></div></header><main class="content"><div class="grid cols-4" id="metrics"></div><div class="grid cols-2" style="margin-top:24px"><section class="card"><h3>Nova campanha</h3><form id="campaignForm" class="form"><div class="form-row"><div><label>Nome</label><input id="cname" required value="Clube Espresso"></div><div><label>Código</label><input id="ccode" required value="ESPRESSO5"></div></div><div class="form-row"><div><label>Meta</label><input id="cgoal" type="number" min="1" max="50" value="5"></div><div><label>Ícone</label><input id="cicon" value="☕"></div></div><div><label>Recompensa</label><input id="creward" required value="1 espresso grátis"></div><div class="form-row"><div><label>Intervalo mínimo (s)</label><input id="cinterval" type="number" value="60"></div><div><label>Máx. selos/hora/cartão</label><input id="chour" type="number" value="6"></div></div><button class="btn">Criar campanha</button><div id="campaignMsg"></div></form></section><section class="card"><h3>Novo usuário</h3><form id="staffForm" class="form"><div><label>Nome</label><input id="sname" required></div><div><label>E-mail</label><input id="semail" type="email" required></div><div class="form-row"><div><label>Perfil</label><select id="srole"><option value="attendant">Atendente</option><option value="manager">Gerente</option></select></div><div><label>Senha inicial</label><input id="spass" type="password" minlength="10" required></div></div><button class="btn">Criar usuário</button><div id="staffMsg"></div></form></section></div><section class="card" style="margin-top:24px"><h3>Campanhas</h3><div id="campaigns"></div></section><section class="card" style="margin-top:24px"><h3>Equipe</h3><div id="staff"></div></section><section class="card" style="margin-top:24px"><h3>Auditoria de operações</h3><div id="tx"></div></section></main><script src="/static/app.js"></script><script>
const {api,$}=Clube;let csrf='';async function boot(){const s=await api('/api/session');if(!s.authenticated||s.user.role!=='manager'){location='/login';return}csrf=s.csrf;$('#who').textContent=s.user.name;load()}
async function load(){const j=await api('/api/manager/overview');$('#metrics').innerHTML=`<div class="metric"><span class="muted">Clientes</span><b>${j.metrics.customers}</b></div><div class="metric"><span class="muted">Selos</span><b>${j.metrics.stamps}</b></div><div class="metric"><span class="muted">Resgates</span><b>${j.metrics.redeems}</b></div><div class="metric"><span class="muted">Campanhas</span><b>${j.campaigns.length}</b></div>`;$('#campaigns').innerHTML=`<table class="table"><tr><th>Nome</th><th>Código</th><th>Regra</th><th>QR adesão</th></tr>${j.campaigns.map(c=>`<tr><td>${c.name}</td><td><span class="badge">${c.code}</span></td><td>${c.goal} → ${c.reward_name}</td><td><a href="/join?campaign=${encodeURIComponent(c.code)}" target="_blank">Abrir</a></td></tr>`).join('')}</table>`;$('#staff').innerHTML=`<table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr>${j.staff.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.active?'Ativo':'Inativo'}</td></tr>`).join('')}</table>`;$('#tx').innerHTML=j.transactions.length?`<table class="table"><tr><th>Cliente</th><th>Ação</th><th>Operador</th><th>Antes → Depois</th><th>Data</th></tr>${j.transactions.map(t=>`<tr><td>${t.customer_name}</td><td>${t.type}${t.type==='stamp'?' +'+t.value:''}</td><td>${t.user_name||'Sistema'}</td><td>${t.previous_progress} → ${t.new_progress}</td><td>${Clube.fmtDate(t.created_at)}</td></tr>`).join('')}</table>`:'<p class="muted">Sem operações.</p>'}
$('#campaignForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/manager/campaign',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({name:$('#cname').value,code:$('#ccode').value,goal:+$('#cgoal').value,icon:$('#cicon').value,reward_name:$('#creward').value,min_interval:+$('#cinterval').value,max_hour:+$('#chour').value,max_day:500})});$('#campaignMsg').innerHTML='<div class="notice success">Campanha criada.</div>';load()}catch(err){$('#campaignMsg').innerHTML='<div class="notice error">'+(err.data?.error||err.message)+'</div>'}};
$('#staffForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/manager/staff',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({name:$('#sname').value,email:$('#semail').value,password:$('#spass').value,role:$('#srole').value})});$('#staffMsg').innerHTML='<div class="notice success">Usuário criado.</div>';e.target.reset();load()}catch(err){$('#staffMsg').innerHTML='<div class="notice error">'+(err.data?.error||err.message)+'</div>'}};boot();
</script></body></html>
