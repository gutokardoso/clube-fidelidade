<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerência • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">CLUBE FIDELIDADE</div><h2>Painel do gerente</h2><span id="who" class="muted"></span></div><div class="actions"><a class="btn secondary" href="/attendant">Abrir atendimento</a><button class="btn secondary" onclick="Clube.logout()">Sair</button></div></header><main class="content"><div class="grid cols-4" id="metrics"></div><div class="grid cols-2" style="margin-top:24px"><section class="card"><h3>Nova campanha</h3><form id="campaignForm" class="form"><div class="form-row"><div><label>Nome</label><input id="cname" required value="Clube Espresso"></div><div><label>Código</label><input id="ccode" required value="ESPRESSO5"></div></div><div class="form-row"><div><label>Meta</label><input id="cgoal" type="number" min="1" max="50" value="5"></div><div><label>Ícone</label><input id="cicon" value="☕"></div></div><div><label>Recompensa</label><input id="creward" required value="1 espresso grátis"></div><div><label>Logo da campanha</label><input id="clogo" type="file" accept="image/png,image/jpeg,image/webp" required><p class="small muted">PNG, JPG ou WEBP. Máximo de 500 KB. A logo aparecerá na página de cadastro do cliente.</p><div id="logoPreview" class="logo-preview hidden"></div></div><div class="form-row"><div><label>Intervalo mínimo (s)</label><input id="cinterval" type="number" value="60"></div><div><label>Máx. selos/hora/cartão</label><input id="chour" type="number" value="6"></div></div><button class="btn">Criar campanha</button><div id="campaignMsg"></div></form></section><section class="card"><h3>Novo usuário</h3><form id="staffForm" class="form"><div><label>Nome</label><input id="sname" required></div><div><label>E-mail</label><input id="semail" type="email" required></div><div class="form-row"><div><label>Perfil</label><select id="srole"><option value="attendant">Atendente</option><option value="manager">Gerente</option></select></div><div><label>Senha inicial</label><input id="spass" type="password" minlength="10" required></div></div><button class="btn">Criar usuário</button><div id="staffMsg"></div></form></section></div><section class="card" style="margin-top:24px"><h3>Campanhas</h3><div id="campaigns"></div></section><section class="card" style="margin-top:24px"><h3>Equipe</h3><div id="staff"></div></section><section class="card" style="margin-top:24px"><h3>Auditoria de operações</h3><div id="tx"></div></section></main><script src="/static/app.js"></script><script>
const {api,$}=Clube;let csrf='';let me=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
async function boot(){const s=await api('/api/session');if(!s.authenticated||s.user.role!=='manager'){location='/login';return}csrf=s.csrf;me=s.user;$('#who').textContent=s.user.name;load()}
async function load(){const j=await api('/api/manager/overview');$('#metrics').innerHTML=`<div class="metric"><span class="muted">Clientes</span><b>${j.metrics.customers}</b></div><div class="metric"><span class="muted">Selos</span><b>${j.metrics.stamps}</b></div><div class="metric"><span class="muted">Resgates</span><b>${j.metrics.redeems}</b></div><div class="metric"><span class="muted">Campanhas</span><b>${j.campaigns.length}</b></div>`;$('#campaigns').innerHTML=`<table class="table"><tr><th>Logo</th><th>Nome</th><th>Código</th><th>Regra</th><th>QR adesão</th><th></th></tr>${j.campaigns.map(c=>`<tr><td>${c.logo_image?`<img class="table-logo" src="${esc(c.logo_image)}" alt="">`:'—'}</td><td>${esc(c.name)}</td><td><span class="badge">${esc(c.code)}</span></td><td>${c.goal} → ${esc(c.reward_name)}</td><td><a href="/join?campaign=${encodeURIComponent(c.code)}" target="_blank">Abrir</a></td><td class="right"><button class="btn danger btn-small" onclick="deleteCampaign(${c.id},'${esc(c.name).replace(/&#39;/g,"\\'")}')">Excluir</button></td></tr>`).join('')}</table>`;$('#staff').innerHTML=`<table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr>${j.staff.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'Ativo':'Inativo'}</td><td class="right">${u.id===me.id?'<span class="muted small">Você</span>':`<button class="btn danger btn-small" onclick="deleteStaff(${u.id},'${esc(u.name).replace(/&#39;/g,"\\'")}')">Excluir</button>`}</td></tr>`).join('')}</table>`;$('#tx').innerHTML=j.transactions.length?`<table class="table"><tr><th>Cliente</th><th>Ação</th><th>Operador</th><th>Antes → Depois</th><th>Data</th></tr>${j.transactions.map(t=>`<tr><td>${esc(t.customer_name)}</td><td>${esc(t.type)}${t.type==='stamp'?' +'+t.value:''}</td><td>${esc(t.user_name||'Sistema')}</td><td>${t.previous_progress} → ${t.new_progress}</td><td>${Clube.fmtDate(t.created_at)}</td></tr>`).join('')}</table>`:'<p class="muted">Sem operações.</p>'}
async function fileToDataUrl(file){if(!file)return null;if(file.size>500000)throw new Error('A logo deve ter no máximo 500 KB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Use uma imagem PNG, JPG ou WEBP.');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}
$('#clogo').onchange=async e=>{const f=e.target.files?.[0];const box=$('#logoPreview');if(!f){box.classList.add('hidden');box.innerHTML='';return}try{const src=await fileToDataUrl(f);box.innerHTML=`<img src="${src}" alt="Prévia da logo">`;box.classList.remove('hidden')}catch(err){e.target.value='';box.classList.add('hidden');$('#campaignMsg').innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}};
$('#campaignForm').onsubmit=async e=>{e.preventDefault();try{const logo=await fileToDataUrl($('#clogo').files?.[0]);await api('/api/manager/campaign',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({name:$('#cname').value,code:$('#ccode').value,goal:+$('#cgoal').value,icon:$('#cicon').value,reward_name:$('#creward').value,logo_image:logo,min_interval:+$('#cinterval').value,max_hour:+$('#chour').value,max_day:500})});$('#campaignMsg').innerHTML='<div class="notice success">Campanha criada.</div>';e.target.reset();$('#logoPreview').classList.add('hidden');$('#logoPreview').innerHTML='';load()}catch(err){$('#campaignMsg').innerHTML='<div class="notice error">'+esc(err.data?.error||err.message)+'</div>'}};
$('#staffForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/manager/staff',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({name:$('#sname').value,email:$('#semail').value,password:$('#spass').value,role:$('#srole').value})});$('#staffMsg').innerHTML='<div class="notice success">Usuário criado.</div>';e.target.reset();load()}catch(err){$('#staffMsg').innerHTML='<div class="notice error">'+esc(err.data?.error||err.message)+'</div>'}};
async function deleteCampaign(id,name){if(!confirm(`Excluir a campanha “${name}”? Todos os cartões, selos e histórico de transações vinculados a ela serão removidos.`))return;try{const j=await api('/api/manager/campaign/delete',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({campaign_id:id})});alert(`Campanha excluída. ${j.deleted_memberships||0} cartão(ões) vinculado(s) removido(s).`);load()}catch(err){alert('Não foi possível excluir: '+(err.data?.error||err.message))}}
async function deleteStaff(id,name){if(!confirm(`Excluir o usuário “${name}”?`))return;try{await api('/api/manager/staff/delete',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({user_id:id})});load()}catch(err){const map={cannot_delete_self:'Você não pode excluir seu próprio usuário.',configured_admin_protected:'O gerente configurado pelo Railway não pode ser excluído.',last_manager_protected:'É necessário manter pelo menos um gerente.'};alert(map[err.data?.error]||('Não foi possível excluir: '+(err.data?.error||err.message)))}}
boot();
</script><div class="build-marker">v8</div></body></html>
