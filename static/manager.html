<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerência Taboo • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">CLUBE FIDELIDADE</div><h2>Painel Taboo</h2><span id="who" class="muted"></span></div><div class="actions"><button class="btn secondary" onclick="Clube.logout()">Sair</button></div></header><main class="content"><div class="grid cols-4" id="metrics"></div><div class="grid cols-2" style="margin-top:24px"><section class="card"><h3>Novo cliente</h3><form id="campaignForm" class="form"><div class="form-row"><div><label>Nome do cliente</label><input id="cname" required placeholder="Ex.: Café Central"></div><div><label>Código</label><input id="ccode" required placeholder="Ex.: CAFE5"></div></div><div class="form-row"><div><label>Meta</label><input id="cgoal" type="number" min="1" max="50" value="5"></div><div><label>Ícone</label><select id="ciconmode"><option value="icon">Inserir um ícone</option><option value="logo">Usar a logo do cliente</option></select><input id="cicon" value="☕" style="margin-top:8px" aria-label="Ícone do selo"></div></div><div><label>Recompensa</label><input id="creward" required placeholder="Ex.: 1 café grátis"></div><div><label>Logo do cliente</label><input id="clogo" type="file" accept="image/png,image/jpeg,image/webp" required><p class="small muted">PNG, JPG ou WEBP. Máximo de 500 KB. A logo aparecerá na página de cadastro do consumidor.</p><div id="logoPreview" class="logo-preview hidden"></div></div><div class="form-row"><div><label>Intervalo mínimo (em segundos)</label><input id="cinterval" type="number" min="0" value="60"></div><div><label>Máx. selos/hora/cartão (em 1 hora)</label><input id="chour" type="number" min="1" value="6"></div></div><button class="btn">Criar cliente</button><div id="campaignMsg"></div></form></section><section class="card"><h3>Novo atendente</h3><form id="staffForm" class="form"><div><label>Nome</label><input id="sname" required></div><div><label>E-mail</label><input id="semail" type="email" required></div><div><label>Cliente</label><select id="sclient" required><option value="">Selecione um cliente</option></select><p class="small muted">O atendente terá acesso somente à área deste cliente.</p></div><div><label>Senha inicial</label><input id="spass" type="password" minlength="10" required></div><button class="btn">Criar atendente</button><div id="staffMsg"></div></form></section></div><section class="card" style="margin-top:24px"><h3>Clientes</h3><div id="campaigns"></div></section><section class="card" style="margin-top:24px"><h3>Atendentes</h3><div id="staff"></div></section></main><script src="/static/app.js"></script><script>
const {api,$}=Clube;let csrf='';let me=null;let clients=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
async function boot(){const s=await api('/api/session');if(!s.authenticated||s.user.role!=='manager'){location='/login';return}csrf=s.csrf;me=s.user;$('#who').textContent=s.user.name+' • acesso geral Taboo';load()}
async function managerPost(url,body){
  const send=()=>api(url,{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify(body)});
  try{return await send()}catch(err){
    if(err.data?.error!=='csrf_failed')throw err;
    const current=await api('/api/session').catch(()=>null);
    if(!current?.authenticated||current.user?.role!=='manager'){
      throw Object.assign(new Error('Sua sessão de gerente foi substituída por outro login neste navegador. Entre novamente como gerente.'),{data:{error:'manager_session_changed'}});
    }
    csrf=current.csrf;
    return await send();
  }
}
async function load(){const j=await api('/api/manager/overview');clients=j.campaigns;$('#metrics').innerHTML=`<div class="metric"><span class="muted">Cartões</span><b>${j.metrics.customers}</b></div><div class="metric"><span class="muted">Selos</span><b>${j.metrics.stamps}</b></div><div class="metric"><span class="muted">Resgates</span><b>${j.metrics.redeems}</b></div><div class="metric"><span class="muted">Clientes</span><b>${j.campaigns.length}</b></div>`;$('#sclient').innerHTML='<option value="">Selecione um cliente</option>'+j.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#campaigns').innerHTML=j.campaigns.length?`<table class="table"><tr><th>Logo</th><th>Cliente</th><th>Código</th><th>Regra</th><th>Cartões</th><th>Selos</th><th>Cadastro</th><th></th></tr>${j.campaigns.map(c=>`<tr><td>${c.logo_image?`<img class="table-logo" src="${esc(c.logo_image)}" alt="">`:'—'}</td><td>${esc(c.name)}</td><td><span class="badge">${esc(c.code)}</span></td><td>${c.goal} → ${esc(c.reward_name)}</td><td><b>${c.card_count||0}</b></td><td><b>${c.stamp_count||0}</b></td><td><a href="/join?campaign=${encodeURIComponent(c.code)}" target="_blank">Abrir</a></td><td class="right"><button class="btn danger btn-small" onclick="deleteClient(${c.id},'${esc(c.name).replace(/&#39;/g,"\\'")}')">Excluir</button></td></tr>`).join('')}</table>`:'<p class="muted">Nenhum cliente cadastrado.</p>';const attendants=j.staff.filter(u=>u.role==='attendant');$('#staff').innerHTML=attendants.length?`<table class="table"><tr><th>Nome</th><th>E-mail</th><th>Cliente</th><th>Status</th><th></th></tr>${attendants.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.client_name||'Não vinculado')}</td><td>${u.active?'Ativo':'Inativo'}</td><td class="right"><button class="btn danger btn-small" onclick="deleteStaff(${u.id},'${esc(u.name).replace(/&#39;/g,"\\'")}')">Excluir</button></td></tr>`).join('')}</table>`:'<p class="muted">Nenhum atendente cadastrado.</p>'}
async function fileToDataUrl(file){if(!file)return null;if(file.size>500000)throw new Error('A logo deve ter no máximo 500 KB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Use uma imagem PNG, JPG ou WEBP.');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}
$('#clogo').onchange=async e=>{const f=e.target.files?.[0];const box=$('#logoPreview');if(!f){box.classList.add('hidden');box.innerHTML='';return}try{const src=await fileToDataUrl(f);box.innerHTML=`<img src="${src}" alt="Prévia da logo">`;box.classList.remove('hidden')}catch(err){e.target.value='';box.classList.add('hidden');$('#campaignMsg').innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}};
$('#campaignForm').onsubmit=async e=>{e.preventDefault();try{const logo=await fileToDataUrl($('#clogo').files?.[0]);const icon=$('#ciconmode').value==='logo'?'__LOGO__':$('#cicon').value;await managerPost('/api/manager/campaign',{name:$('#cname').value,code:$('#ccode').value,goal:+$('#cgoal').value,icon,reward_name:$('#creward').value,logo_image:logo,min_interval:+$('#cinterval').value,max_hour:+$('#chour').value,max_day:500});$('#campaignMsg').innerHTML='<div class="notice success">Cliente criado.</div>';e.target.reset();$('#logoPreview').classList.add('hidden');$('#logoPreview').innerHTML='';load()}catch(err){const map={campaign_code_exists:'Este código já está em uso.',logo_required:'Envie a logo do cliente.',manager_session_changed:'Sua sessão de gerente foi substituída por outro login neste navegador. Entre novamente como gerente.'};$('#campaignMsg').innerHTML='<div class="notice error">'+esc(map[err.data?.error]||err.data?.error||err.message)+'</div>'}};
$('#ciconmode').onchange=()=>{$('#cicon').classList.toggle('hidden',$('#ciconmode').value==='logo')};
$('#staffForm').onsubmit=async e=>{e.preventDefault();try{await managerPost('/api/manager/staff',{name:$('#sname').value,email:$('#semail').value,password:$('#spass').value,campaign_id:+$('#sclient').value});$('#staffMsg').innerHTML='<div class="notice success">Atendente criado e vinculado ao cliente.</div>';e.target.reset();load()}catch(err){const map={email_exists:'Este e-mail já está cadastrado.',client_not_found:'Cliente não encontrado.',invalid_staff:'Preencha todos os campos corretamente.',manager_session_changed:'Sua sessão de gerente foi substituída por outro login neste navegador. Entre novamente como gerente.'};$('#staffMsg').innerHTML='<div class="notice error">'+esc(map[err.data?.error]||err.data?.error||err.message)+'</div>'}};
async function deleteClient(id,name){if(!confirm(`Excluir o cliente “${name}”? Os cartões, selos e histórico vinculados serão removidos.`))return;try{const j=await managerPost('/api/manager/campaign/delete',{campaign_id:id});alert(`Cliente excluído. ${j.deleted_memberships||0} cartão(ões) removido(s).`);load()}catch(err){if(err.data?.error==='client_has_attendants'){alert(`Este cliente possui ${err.data.linked_attendants} atendente(s) vinculado(s). Exclua esses atendentes primeiro.`);return}alert('Não foi possível excluir: '+(err.data?.error||err.message))}}
async function deleteStaff(id,name){if(!confirm(`Excluir o atendente “${name}”?`))return;try{await managerPost('/api/manager/staff/delete',{user_id:id});load()}catch(err){alert('Não foi possível excluir: '+(err.data?.error||err.message))}}
boot();
</script><div class="build-marker">v14</div></body></html>
