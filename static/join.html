<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar no clube</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="campaign-logo-wrap">{{LOGO_BLOCK}}</div><h1 id="title">{{CAMPAIGN_NAME}}</h1><form id="f" class="form" method="post" action="/join"><div><label>Seu nome</label><input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name"></div><div><label>E-mail</label><input id="email" name="email" type="email" required maxlength="160" autocomplete="email" placeholder="nome@exemplo.com"></div><div><label>Celular</label><input id="phone" name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999"></div><div><label>Data de Nascimento</label><input id="birth_date" name="birth_date" type="date" required autocomplete="bday"></div><div><label>CPF</label><input id="cpf" name="cpf" required inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00"></div><div class="consent-box"><label class="check-line"><input type="checkbox" name="privacy_consent" value="1" required> Li e aceito a <a id="privacyLink" href="/privacy" target="_blank" rel="noopener">Política de Privacidade</a> e autorizo o tratamento dos meus dados para funcionamento do programa de fidelidade.</label><p class="small muted">Comunicações promocionais são opcionais:</p><label class="check-line"><input type="checkbox" name="marketing_email" value="1"> Quero receber ofertas por e-mail.</label><label class="check-line"><input type="checkbox" name="marketing_whatsapp" value="1"> Quero receber ofertas pelo WhatsApp.</label></div><input type="hidden" id="campaign_code" name="campaign_code" value="CAFE5"><button class="btn" type="submit">Criar meu cartão</button><div id="msg"></div></form></div></div></div><script>
const phone=document.getElementById('phone'),cpf=document.getElementById('cpf'),birth=document.getElementById('birth_date');
birth.max=new Date().toISOString().slice(0,10);
phone.addEventListener('input',()=>{let d=phone.value.replace(/\D/g,'').slice(0,11);if(d.length>6)phone.value=`(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}`;else if(d.length>2)phone.value=`(${d.slice(0,2)}) ${d.slice(2)}`;else phone.value=d});
cpf.addEventListener('input',()=>{let d=cpf.value.replace(/\D/g,'').slice(0,11);cpf.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
</script><div class="build-marker">{{VERSION}}</div></body></html>
