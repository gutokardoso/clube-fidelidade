<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar no clube</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="brand" id="brand">CLUBE</div><h1 id="title">Carregando…</h1><p id="desc" class="muted"></p><form id="f" class="form hidden"><div><label>Seu nome</label><input id="name" required minlength="2" autocomplete="name"></div><div><label>E-mail ou celular <span class="muted">(opcional)</span></label><input id="contact" autocomplete="email"></div><button class="btn">Criar meu cartão</button><div id="msg"></div></form></div></div></div><script src="/static/app.js"></script><script>
const {api,$}=Clube; const qs=new URLSearchParams(location.search); const code=(qs.get('campaign')||'CAFE5').toUpperCase();
(async()=>{try{const j=await api('/api/campaign/public?code='+encodeURIComponent(code));const c=j.campaign;document.documentElement.style.setProperty('--accent',c.primary_color);$('#brand').textContent=c.logo_text;$('#title').textContent=c.name;$('#desc').textContent=`Complete ${c.goal} selos e ganhe ${c.reward_name}.`;$('#f').classList.remove('hidden')}catch{$('#title').textContent='Campanha não encontrada'}})();
$('#f').onsubmit=async e=>{e.preventDefault();try{const j=await api('/api/join',{method:'POST',body:JSON.stringify({campaign_code:code,name:$('#name').value,contact:$('#contact').value})});location='/card?id='+encodeURIComponent(j.public_id)}catch(err){$('#msg').innerHTML='<div class="notice error">Não foi possível criar o cartão.</div>'}};
</script></body></html>
