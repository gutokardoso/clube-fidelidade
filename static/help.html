<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de ajuda • Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">FIDELIZAÊ!<small class="brand-tagline">Fidelidade que marca pontos.</small></div><h2>Central de ajuda</h2></div><div class="actions"><button class="btn secondary" onclick="history.back()">Voltar</button></div></header><main class="content help-center"><section class="card"><span class="eyebrow">SUPORTE</span><h1>Como podemos ajudar?</h1><p class="muted">Pesquise rapidamente os recursos do Fidelizaê! ou consulte os guias abaixo.</p><input id="helpSearch" class="help-search" placeholder="Pesquisar: pontos, selos, WhatsApp, Wallet, relatórios..."></section><div id="helpArticles" class="help-grid"></div></main><script>const articles=[['Primeiros passos','Configure empresa, programa, recompensa, equipe e primeiro cliente. O checklist de configuração no painel mostra o que ainda falta.'],['Clientes','Cadastre, edite, consulte histórico e use os segmentos Novo, Ativo, Recorrente, VIP, Em risco, Inativo, Quase lá e Recompensa disponível.'],['Inteligência de clientes','O sistema calcula compras, ticket médio, frequência, última compra, LTV estimado e risco de abandono com base no comportamento individual.'],['Pontos e selos','Em selos, cada compra avança a meta. Em pontos, o saldo é calculado pela regra de valor gasto definida pela empresa.'],['Recompensas','No programa por pontos, cadastre catálogo, custo, estoque e validade. Em selos, a recompensa principal é definida no programa.'],['Campanhas e segmentação','Crie campanhas para públicos específicos e acompanhe quantos clientes retornaram e a receita atribuída.'],['Automações','Ative mensagens de aniversário, inatividade, quase recompensa e recompensa disponível, respeitando o consentimento do cliente.'],['WhatsApp e e-mail','Configure os canais no painel e envie mensagens individuais, em lote ou automáticas.'],['Apple e Google Wallet','O cartão digital pode ser salvo na Wallet. A Apple Wallet recebe atualizações via push quando o saldo muda.'],['Relatórios','Use a Visão Geral para acompanhar retenção, recorrência, LTV, ticket, receita, campanhas e exporte CSV.'],['Importação de clientes','Em Gestão avançada > Importar clientes, envie CSV ou XLSX. O sistema valida linhas, duplicados e saldo inicial antes de importar.'],['API e webhooks','Em Gestão avançada > Integrações / API, gere uma chave e configure webhooks HTTPS assinados. Consulte /api-docs para exemplos.'],['Segurança / 2FA','Administradores podem ativar autenticação em dois fatores, revisar sessões e revogar acessos antigos.'],['Privacidade / LGPD','Clientes podem gerenciar preferências de comunicação e os recursos de privacidade respeitam os dados vinculados ao programa.']];const box=document.querySelector('#helpArticles'),search=document.querySelector('#helpSearch');function render(){const q=(search.value||'').toLowerCase().trim();const rows=articles.filter(a=>!q||(a[0]+' '+a[1]).toLowerCase().includes(q));box.innerHTML=rows.map(a=>`<article class="card help-article"><h3>${a[0]}</h3><p>${a[1]}</p></article>`).join('')||'<div class="notice">Nenhum guia encontrado.</div>'}search.addEventListener('input',render);render()</script></body></html>
