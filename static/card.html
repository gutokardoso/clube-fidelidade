<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu cartão</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div style="width:min(520px,100%)"><div id="card" class="wallet-card"><div class="brand card-title">CLUBE DE FIDELIDADE</div><div id="clientLogoWrap" class="wallet-client-logo-wrap"><img id="clientLogo" class="wallet-client-logo hidden" alt="Logo do cliente"><div id="clientLogoFallback" class="wallet-client-logo-fallback hidden"></div></div><p id="customer" class="wallet-customer"></p><div class="progress wallet-stamps" id="progress"></div><h2 id="count"></h2><p class="muted" id="reward"></p><div class="card-code"><span>Código do cartão</span><strong id="cardCode">—</strong></div><img class="qr" id="qr" alt="QR individual"><p class="small muted wallet-instruction">Apresente este QR ao atendente para ganhar seu selo.</p></div><div class="card" style="margin-top:18px"><h3>Adicionar à carteira</h3><div class="actions"><a id="apple" class="btn secondary hidden">Apple Wallet</a><a id="google" class="btn secondary hidden">Google Wallet</a></div><div id="walletNote" class="notice">No modo demo, use este cartão web. Apple/Google Wallet serão liberados quando as credenciais oficiais forem configuradas.</div></div></div></div><script src="/static/app.js"></script><script>
const {api,$}=Clube;const id=new URLSearchParams(location.search).get('id');
(async()=>{try{const j=await api('/api/card?id='+encodeURIComponent(id));const c=j.card;document.documentElement.style.setProperty('--accent',c.primary_color);if(c.logo_image){$('#clientLogo').src=c.logo_image;$('#clientLogo').classList.remove('hidden');$('#clientLogoFallback').classList.add('hidden')}else{$('#clientLogoFallback').textContent=c.campaign_name||c.logo_text||'Cliente';$('#clientLogoFallback').classList.remove('hidden');$('#clientLogo').classList.add('hidden')}$('#customer').textContent=c.customer_name;$('#cardCode').textContent=c.card_code||('CLUBE:'+c.public_id);$('#count').textContent=`${c.progress} de ${c.goal}`;$('#reward').textContent=c.rewards_available>0?`🎁 ${c.rewards_available} recompensa(s) disponível(is): ${c.reward_name}`:`Faltam ${c.goal-c.progress} selo(s) para ${c.reward_name}.`;const stampContent=c.icon==='__LOGO__'&&c.logo_image?`<img class="stamp-logo" src="${c.logo_image}" alt="">`:c.icon;const stampCols=c.goal===3?3:c.goal===8?4:5;$('#progress').style.setProperty('--stamp-cols',stampCols);$('#progress').innerHTML=Array.from({length:c.goal},(_,i)=>`<div class="stamp ${i<c.progress?'on':''}">${stampContent}</div>`).join('');$('#qr').src='/api/qr?data='+encodeURIComponent(c.qr_value);if(c.apple_link){$('#apple').href=c.apple_link;$('#apple').classList.remove('hidden')}if(c.google_link){$('#google').href=c.google_link;$('#google').classList.remove('hidden')}}catch{$('#card').innerHTML='<h2>Cartão não encontrado</h2>'}})();
</script><div class="build-marker">v29</div></body></html>
