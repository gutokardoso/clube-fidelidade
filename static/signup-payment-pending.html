<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmando assinatura • Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css?v={{VERSION}}"><style>.payment-pending-card{text-align:center;max-width:620px;margin:auto}.payment-spinner{width:46px;height:46px;border:4px solid #eadfd5;border-top-color:#e87900;border-radius:50%;margin:28px auto 22px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.payment-pending-card h1{margin-bottom:12px}.payment-pending-card p{line-height:1.55}.payment-actions{margin-top:24px}.payment-actions .btn{display:inline-flex;text-decoration:none;justify-content:center}.payment-detail{font-size:14px;opacity:.72;margin-top:12px}</style></head><body class="signup-page"><main class="signup-shell"><a href="/" class="signup-brand">FIDELIZAÊ!</a><section class="signup-card payment-pending-card"><span class="landing-kicker">QUASE PRONTO</span><div id="spinner" class="payment-spinner"></div><h1 id="title">Confirmando sua assinatura...</h1><p id="text">O pagamento foi recebido pelo Mercado Pago e estamos aguardando a confirmação final. Esta página será atualizada automaticamente.</p><div id="detail" class="payment-detail">Você não precisa preencher o cadastro novamente.</div><div id="actions" class="payment-actions"></div></section></main><script>(function(){const id='{{PREAPPROVAL_ID}}',title=document.getElementById('title'),text=document.getElementById('text'),detail=document.getElementById('detail'),spinner=document.getElementById('spinner'),actions=document.getElementById('actions');let attempts=0,maxAttempts=45,busy=false;function stop(){spinner.style.display='none'}function action(){actions.innerHTML='<button class="btn" type="button" id="retry">Verificar novamente</button>';document.getElementById('retry').onclick=check}async function check(){if(busy)return;busy=true;attempts++;try{const r=await fetch('/api/public/signup/payment-status?preapproval_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(r.ok&&j.active){title.textContent='Assinatura confirmada!';text.textContent='Sua conta Fidelizaê! está pronta. Redirecionando para o acesso...';detail.textContent='';setTimeout(()=>location.href=j.redirect||'/login?subscription=active',700);return}if(r.ok&&j.rejection_code==='cc_rejected_high_risk'){stop();title.textContent='Pagamento não aprovado';text.textContent='O Mercado Pago não aprovou esta cobrança pela análise de segurança. Evite repetir várias tentativas em sequência.';detail.textContent=j.next_retry_date?'O Mercado Pago poderá realizar uma nova tentativa automaticamente.':'Você pode tentar novamente mais tarde com um meio de pagamento habitual.';actions.innerHTML='<a class="btn" href="/signup">Voltar ao cadastro</a>';return}if(r.ok&&(j.status==='cancelled'||j.status==='paused')){stop();title.textContent='A assinatura não foi ativada';text.textContent='O Mercado Pago não confirmou a assinatura. Você pode voltar ao cadastro e tentar novamente mais tarde.';detail.textContent='';actions.innerHTML='<a class="btn" href="/signup">Voltar ao cadastro</a>';return}}catch(e){}finally{busy=false}if(attempts<maxAttempts)setTimeout(check,2000);else{stop();title.textContent='A confirmação está demorando um pouco';text.textContent='Sua assinatura ainda está sendo processada pelo Mercado Pago. Seus dados de cadastro continuam preservados.';detail.textContent='Você pode verificar novamente sem refazer o cadastro.';action()}}check()})();</script></body></html>
