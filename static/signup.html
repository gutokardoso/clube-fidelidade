<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assine o Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css?v={{VERSION}}"></head><body class="signup-page"><main class="signup-shell"><a href="/" class="signup-brand">FIDELIZAÊ!</a><section class="signup-card"><span class="landing-kicker">COMECE AGORA</span><h1>Crie sua conta Fidelizaê!</h1><p>Escolha seu plano, cadastre sua empresa e comece a fidelizar.</p><form id="signupForm" class="form"><div class="form-row"><div><label>Empresa</label><input name="company_name" required></div><div><label>Responsável</label><input name="responsible_name" required></div></div><div class="form-row"><div><label>E-mail</label><input name="email" type="email" required></div><div><label>WhatsApp</label><input name="phone" required></div></div><div class="form-row"><div><label>CNPJ/CPF</label><input name="document"></div><div><label>Senha</label><input name="password" type="password" minlength="10" required></div></div><div><label>Logo da empresa</label><input name="logo" id="signupLogo" type="file" accept="image/png,image/jpeg,image/webp" required><p class="small muted">PNG, JPG ou WEBP. Máximo de 500 KB.</p></div><div class="form-row"><div><label>Plano</label><select name="plan" id="plan"><option value="beginner">Iniciante — Grátis</option><option value="intermediate">Intermediário — R$ 49,90/mês</option><option value="pro">PRO — R$ 99,90/mês</option></select></div><div><label>Programa</label><select name="loyalty_type" id="loyalty"><option value="stamps">Selos</option><option value="points">Pontos</option></select></div></div><div id="planSummary" class="plan-note"></div><label class="landing-contact-consent"><input type="checkbox" required> Li e concordo com a Política de Privacidade e com a contratação do plano selecionado.</label><button class="btn" type="submit">Continuar</button><div id="msg"></div></form></section></main><script>const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);if(params.get('plan'))$('#plan').value=params.get('plan');function sync(){const p=$('#plan').value;$('#loyalty').disabled=p==='beginner';if(p==='beginner')$('#loyalty').value='stamps';$('#planSummary').textContent=p==='beginner'?'Grátis • Selos • até 50 clientes • 1 atendente':p==='intermediate'?'R$ 49,90/mês • Selos ou pontos • clientes ilimitados • até 5 atendentes':'R$ 99,90/mês • Recursos avançados, automações, e-mail/WhatsApp e área do cliente';}$('#plan').onchange=sync;sync();$('#signupForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('#msg').innerHTML='<div class="notice">Preparando sua conta...</div>';try{const o=Object.fromEntries(new FormData(e.target));const f=$('#signupLogo').files?.[0];if(f){if(f.size>500*1024)throw {error:'logo_too_large'};if(!['image/png','image/jpeg','image/webp'].includes(f.type))throw {error:'invalid_logo_format'};o.logo_image=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})}delete o.logo;const r=await fetch('/api/public/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}),j=await r.json();if(!r.ok)throw j;if(j.checkout_url){location=j.checkout_url;return}location=j.redirect||'/login'}catch(x){const m={email_exists:'Este e-mail já possui acesso.',mercadopago_not_configured:'O pagamento ainda não está configurado. Tente novamente em instantes.',invalid_signup:'Revise os dados informados.',logo_required:'Envie a logo da empresa.',logo_too_large:'A logo deve ter no máximo 500 KB.',invalid_logo_format:'Use uma imagem PNG, JPG ou WEBP.'};$('#msg').innerHTML='<div class="notice error">'+(m[x.error]||'Não foi possível concluir o cadastro.')+'</div>';b.disabled=false}}</script></body></html>
