<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assine o Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css?v={{VERSION}}"><script src="https://www.mercadopago.com/v2/security.js" view="checkout" output="mpDeviceId"></script></head><body class="signup-page"><main class="signup-shell"><a href="/" class="signup-brand">FIDELIZAÊ!</a><section class="signup-card"><span class="landing-kicker">COMECE AGORA</span><h1>Crie sua conta Fidelizaê!</h1><p class="signup-intro">Complete seus dados e escolha a forma de contratação do plano que você selecionou.</p><form id="signupForm" class="form"><input type="hidden" name="plan" id="plan" value="beginner"><div id="selectedPlan" class="signup-selected-plan"></div><div class="form-row"><div><label>Empresa</label><input name="company_name" required></div><div><label>Responsável</label><input name="responsible_name" required></div></div><div class="form-row"><div><label>E-mail</label><input name="email" type="email" required></div><div><label>WhatsApp</label><input name="phone" required></div></div><div class="form-row"><div><label>CNPJ/CPF</label><input name="document"></div><div><label>Senha</label><input name="password" type="password" minlength="12" required><p class="small muted">Mínimo de 12 caracteres, com maiúscula, minúscula e número.</p></div></div><div><label>Logo da empresa</label><input name="logo" id="signupLogo" type="file" accept="image/png,image/jpeg,image/webp" required><p class="small muted">PNG, JPG ou WEBP. Máximo de 500 KB.</p></div><div class="form-row signup-options-row"><div id="billingWrap"><label>Forma de contratação</label><select name="billing_option" id="billingOption"></select></div><div><label>Programa</label><select name="loyalty_type" id="loyalty"><option value="stamps">Selos</option><option value="points">Pontos</option></select></div></div><div id="planSummary" class="plan-note signup-contract-note"></div><label class="landing-contact-consent"><input type="checkbox" required> <span id="consentText">Li e concordo com a Política de Privacidade e com a contratação selecionada.</span></label><button class="btn" type="submit">Continuar</button><div id="msg"></div></form></section></main><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);
const plan=(['beginner','intermediate','pro'].includes(params.get('plan'))?params.get('plan'):'beginner');
$('#plan').value=plan;
const plans={
 beginner:{name:'Iniciante',base:'Grátis',tag:'Para começar',options:[['free','Grátis']],summary:'Programa por selos • até 50 clientes • 1 atendente'},
 intermediate:{name:'Intermediário',base:'R$ 49,90/mês',tag:'Para profissionalizar',options:[['monthly','Mensal — R$ 49,90/mês'],['annual_monthly','Anual (10%) — R$ 44,90/mês'],['annual_upfront','Anual à vista (15%) — R$ 515,00']],summary:'Selos ou pontos • clientes ilimitados • até 5 atendentes'},
 pro:{name:'PRO',base:'R$ 99,90/mês',tag:'Para automatizar',options:[['monthly','Mensal — R$ 99,90/mês'],['annual_monthly','Anual (10%) — R$ 89,90/mês'],['annual_upfront','Anual à vista (15%) — R$ 1.020,00']],summary:'Recursos avançados • automações • e-mail/WhatsApp • área do cliente'}
};
const contractText={monthly:'Cobrança mensal recorrente. Pode ser cancelada a qualquer momento, sem cobrança de novos ciclos após o cancelamento.',annual_monthly:'Compromisso anual de 12 meses com desconto. A cobrança é feita mês a mês durante o período contratado. Não há cancelamento antecipado nem estorno dos valores já cobrados, observados os direitos legais aplicáveis.',annual_upfront:'Plano anual pago à vista, com 12 meses de acesso e desconto maior. Não há cancelamento antecipado nem estorno do valor pago, observados os direitos legais aplicáveis.',free:'Plano gratuito, sem cobrança.'};
function renderPlan(){const p=plans[plan];$('#selectedPlan').innerHTML=`<div><span class="signup-plan-label">PLANO SELECIONADO</span><strong>${p.name}</strong><small>${p.tag}</small></div><div class="signup-plan-price">${p.base}</div>`;const sel=$('#billingOption');sel.innerHTML=p.options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('#billingWrap').classList.toggle('hidden',plan==='beginner');$('#loyalty').disabled=plan==='beginner';if(plan==='beginner')$('#loyalty').value='stamps';syncBilling()}
function syncBilling(){const p=plans[plan],b=$('#billingOption').value||'free';let detail=p.summary;if(b==='monthly')detail='Mensal • '+p.summary+' • cancelamento a qualquer momento';if(b==='annual_monthly')detail='Anual parcelado • 12 cobranças mensais • '+p.summary;if(b==='annual_upfront')detail='Anual à vista • 12 meses de acesso • '+p.summary;$('#planSummary').innerHTML=`<b>${p.name}</b><span>${detail}</span><small>${contractText[b]}</small>`;$('#consentText').textContent=b.startsWith('annual')?'Li e concordo com a Política de Privacidade e com o compromisso anual selecionado.':'Li e concordo com a Política de Privacidade e com a contratação selecionada.'}
$('#billingOption').addEventListener('change',syncBilling);renderPlan();
$('#signupForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('#msg').innerHTML='<div class="notice">Preparando sua conta...</div>';try{const o=Object.fromEntries(new FormData(e.target));o.mp_device_id=(window.mpDeviceId||window.MP_DEVICE_SESSION_ID||'');const f=$('#signupLogo').files?.[0];if(f){if(f.size>500*1024)throw {error:'logo_too_large'};if(!['image/png','image/jpeg','image/webp'].includes(f.type))throw {error:'invalid_logo_format'};o.logo_image=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})}delete o.logo;const r=await fetch('/api/public/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}),j=await r.json();if(!r.ok)throw j;if(j.checkout_url){location=j.checkout_url;return}location=j.redirect||'/login'}catch(x){const m={email_exists:'Este e-mail já possui acesso.',mercadopago_not_configured:'O pagamento ainda não está configurado. Tente novamente em instantes.',invalid_signup:'Revise os dados informados.',logo_required:'Envie a logo da empresa.',logo_too_large:'A logo deve ter no máximo 500 KB.',invalid_logo_format:'Use uma imagem PNG, JPG ou WEBP.'};$('#msg').innerHTML='<div class="notice error">'+(m[x.error]||'Não foi possível concluir o cadastro.')+'</div>';b.disabled=false}}
</script></body></html>
