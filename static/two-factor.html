<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificação em duas etapas • Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css?v={{VERSION}}"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="brand">FIDELIZAÊ!</div><h1>Verificação em duas etapas</h1><p class="muted">Digite o código de 6 dígitos do seu aplicativo autenticador.</p><form class="form" method="post" action="/login/2fa"><label>Código de segurança</label><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus><button class="btn" type="submit">Verificar e entrar</button><div id="msg"></div></form><div class="notice" style="margin-top:18px">O código muda a cada 30 segundos. Não compartilhe esse código.</div></div></div></div><div class="build-marker">{{VERSION}}</div></body></html>
