<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="brand">CLUBE FIDELIDADE</div><h1>Acesso da equipe</h1><p class="muted">Entre como atendente ou gerente.</p><form id="f" class="form" method="post" action="/login"><div><label>E-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div><div><label>Senha</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Entrar</button><button class="forgot-link" id="forgotToggle" type="button">Esqueci minha senha</button><div id="msg"></div></form><form id="forgotForm" class="form hidden" style="margin-top:16px"><div><label>E-mail cadastrado</label><input id="forgotEmail" type="email" required autocomplete="email" placeholder="seuemail@empresa.com.br"></div><button class="btn ok" type="submit">Enviar senha</button><div id="forgotMsg"></div></form><div class="notice" style="margin-top:18px">Use o e-mail e a senha cadastrados para sua equipe.</div></div></div></div><script src="/static/app.js"></script><script>const {api,$}=Clube;$('#forgotToggle').onclick=()=>{$('#forgotForm').classList.toggle('hidden');if(!$('#forgotForm').classList.contains('hidden')){$('#forgotEmail').value=$('#email').value||'';$('#forgotEmail').focus()}};$('#forgotForm').onsubmit=async e=>{e.preventDefault();$('#forgotMsg').innerHTML='';try{await api('/api/forgot-password',{method:'POST',body:JSON.stringify({email:$('#forgotEmail').value})});alert('Enviamos sua senha para o e-mail cadastrado');$('#forgotMsg').innerHTML='<div class="notice success">Enviamos sua senha para o e-mail cadastrado</div>';$('#forgotForm').classList.add('hidden')}catch(err){const map={invalid_email:'Digite um e-mail válido.',smtp_not_configured:'Configure a API de e-mail da Brevo no Railway.',email_provider_not_configured:'Configure a API de e-mail da Brevo no Railway.',brevo_auth_failed:'A API Key da Brevo foi recusada.',brevo_sender_invalid:'A Brevo recusou o remetente configurado.',brevo_api_timeout:'A API da Brevo não respondeu a tempo.',brevo_api_connection_failed:'Não foi possível conectar à API da Brevo.',brevo_api_failed:'A Brevo recusou o envio.',smtp_send_failed:'Não foi possível enviar o e-mail. Tente novamente.'};$('#forgotMsg').innerHTML='<div class="notice error">'+(map[err.data?.error]||err.data?.error||err.message)+'</div>'}};</script><div class="build-marker">v29</div></body></html>
