<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="brand">CLUBE FIDELIDADE</div><h1>Acesso da equipe</h1><p class="muted">Entre como atendente ou gerente.</p><form id="f" class="form"><div><label>E-mail</label><input id="email" type="email" required value="gerente@demo.local"></div><div><label>Senha</label><input id="password" type="password" required value="Gerente123!"></div><button class="btn">Entrar</button><div id="msg"></div></form><div class="notice" style="margin-top:18px"><b>Demo gerente:</b> gerente@demo.local / Gerente123!<br><b>Demo atendente:</b> atendente@demo.local / Atendente123!</div></div></div></div><script src="/static/app.js"></script><script>
const {api,$}=Clube; $('#f').onsubmit=async e=>{e.preventDefault();$('#msg').textContent='';try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});location=j.role==='manager'?'/manager':'/attendant'}catch(err){$('#msg').innerHTML='<div class="notice error">Login inválido.</div>'}};
</script></body></html>
