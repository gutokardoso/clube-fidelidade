<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha • Fidelizaê!</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><div class="login-wrap"><div class="login-card"><div class="brand">FIDELIZAÊ!</div><h1>Redefinir senha</h1><p class="muted">Crie uma nova senha com pelo menos 10 caracteres.</p><form id="f" class="form"><label>Nova senha</label><input id="p1" type="password" minlength="10" required><label>Confirmar senha</label><input id="p2" type="password" minlength="10" required><button class="btn">Salvar nova senha</button><div id="msg"></div></form></div></div></div><script src="/static/app.js"></script><script>const {api,$}=Clube;const token=new URLSearchParams(location.search).get('token')||'';$('#f').onsubmit=async e=>{e.preventDefault();if($('#p1').value!==$('#p2').value){$('#msg').innerHTML='<div class="notice error">As senhas não coincidem.</div>';return}try{await api('/api/reset-password',{method:'POST',body:JSON.stringify({token,password:$('#p1').value})});$('#msg').innerHTML='<div class="notice success">Senha atualizada. Você já pode entrar.</div>';setTimeout(()=>location='/login',1200)}catch(err){$('#msg').innerHTML='<div class="notice error">Link inválido/expirado ou senha inválida.</div>'}}</script><div class="build-marker">{{VERSION}}</div></body></html>
