<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento • Clube Fidelidade</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><div><div class="brand">CLUBE FIDELIDADE</div><h2>Atendimento</h2><span id="who" class="muted"></span></div><div class="actions"><a id="managerLink" class="btn secondary hidden" href="/manager">Painel gerente</a><button class="btn secondary" onclick="Clube.logout()">Sair</button></div></header><main class="content"><div class="split"><section class="scanner"><div class="scanner-box"><video id="video" playsinline muted></video><div class="scanner-frame"></div><span id="camNote">Câmera desligada</span></div><div class="actions"><button id="startCam" class="btn">Escanear QR</button><button id="stopCam" class="btn secondary">Parar câmera</button></div><div class="card"><label>Ou cole/digite o código do cartão</label><div class="form-row" style="margin-top:8px"><input id="token" placeholder="CLUBE:..."><button id="lookup" class="btn">Buscar</button></div></div></section><section><div id="member" class="card"><h2>Aguardando cartão</h2><p class="muted">Escaneie o QR do cliente para iniciar.</p></div><div id="msg" style="margin-top:12px"></div></section></div><section class="card" style="margin-top:24px"><h3>Minhas últimas operações</h3><div id="recent"></div></section></main><script src="/static/app.js"></script><script>
const {api,$,idem,deviceId}=Clube;let csrf='',role='',current=null,stream=null,scanTimer=null;
async function boot(){const s=await api('/api/session');if(!s.authenticated){location='/login';return}csrf=s.csrf;role=s.user.role;$('#who').textContent=s.user.name+' • '+role;if(role==='manager')$('#managerLink').classList.remove('hidden');loadRecent()}
async function loadRecent(){const j=await api('/api/attendant/recent');$('#recent').innerHTML=j.transactions.length?`<table class="table"><tr><th>Cliente</th><th>Ação</th><th>Data</th></tr>${j.transactions.map(t=>`<tr><td>${t.customer_name}</td><td>${t.type==='stamp'?'+'+t.value+' selo':'Resgate'}</td><td>${Clube.fmtDate(t.created_at)}</td></tr>`).join('')}</table>`:'<p class="muted">Sem operações.</p>'}
async function lookup(value){try{const j=await api('/api/attendant/lookup?token='+encodeURIComponent(value));current=j.membership;renderMember()}catch(e){current=null;$('#member').innerHTML='<div class="notice error">Cartão não encontrado.</div>'}}
function renderMember(){const m=current;$('#token').value='CLUBE:'+m.qr_token;$('#member').innerHTML=`<h2>${m.customer_name}</h2><p class="muted">${m.campaign_name}</p><div class="progress">${Array.from({length:m.goal},(_,i)=>`<div class="stamp ${i<m.progress?'on':''}">${m.icon}</div>`).join('')}</div><h3>${m.progress}/${m.goal}</h3><p>${m.rewards_available?`🎁 ${m.rewards_available} recompensa(s) disponível(is)`:'Nenhuma recompensa disponível'}</p><div class="actions"><button class="btn ok" id="add">+ Adicionar selo</button><button class="btn secondary" id="redeem" ${m.rewards_available<1?'disabled':''}>Resgatar prêmio</button></div>`;$('#add').onclick=()=>stamp();$('#redeem').onclick=()=>redeem()}
async function stamp(){try{$('#msg').innerHTML='';const j=await api('/api/attendant/stamp',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({token:'CLUBE:'+current.qr_token,quantity:1,idempotency_key:idem(),device_id:deviceId()})});$('#msg').innerHTML=`<div class="notice success">Selo adicionado para ${j.customer_name}.${j.reward_added?' Recompensa liberada!':''}</div>`;await lookup(current.qr_token);loadRecent()}catch(e){$('#msg').innerHTML=`<div class="notice error">${e.data?.message||e.message}</div>`}}
async function redeem(){try{const j=await api('/api/attendant/redeem',{method:'POST',headers:{'X-CSRF-Token':csrf},body:JSON.stringify({token:current.qr_token,idempotency_key:idem()})});$('#msg').innerHTML='<div class="notice success">Recompensa resgatada.</div>';await lookup(current.qr_token);loadRecent()}catch(e){$('#msg').innerHTML=`<div class="notice error">${e.data?.message||e.message}</div>`}}
$('#lookup').onclick=()=>lookup($('#token').value);$('#startCam').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('Este navegador não possui leitor QR nativo. Use o campo de código abaixo.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#video').srcObject=stream;await $('#video').play();$('#camNote').classList.add('hidden');const det=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const codes=await det.detect($('#video'));if(codes[0]?.rawValue){$('#token').value=codes[0].rawValue;stopCam();lookup(codes[0].rawValue)}}catch{}},500)}catch{alert('Não foi possível abrir a câmera.')}};function stopCam(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camNote').classList.remove('hidden')}$('#stopCam').onclick=stopCam;boot();
</script></body></html>
